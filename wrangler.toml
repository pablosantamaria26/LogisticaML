# Flota ML 2.0 — Worker Cloudflare
# Deploy: npx wrangler deploy
# Secrets (persisten entre deploys): GEMINI_API_KEY, SENDGRID_API_KEY (Brevo),
#   VAPID_PRIVATE_KEY, OWNER_EMAIL, FLEET_EMAIL, AUTH_PEPPER

name = "logisticaml"
main = "worker/worker.js"
compatibility_date = "2026-03-05"
compatibility_flags = ["nodejs_compat"]

# ── CRON (límite 5 por CUENTA free — usamos 2, ramifica por fecha AR adentro) ─
#  "0 11 * * *" → 08:00 AR: revisión diaria (lun-vie) + limpieza (vie) + día 1: reporte dueño y papeles
#  "0 12 * * *" → 09:00 AR: día 15 neumáticos, día 20 auxilio, día 25 contador, sábado reporte semanal
[triggers]
crons = ["0 11 * * *", "0 12 * * *"]

[[kv_namespaces]]
binding = "FLOTA_KV"
id = "c33c0e4c860c4a3cbbca28ff13be1541"

[[d1_databases]]
binding = "DB"
database_name = "flota-ml"
database_id = "d7fb5ae3-f035-4de6-9ea0-3f7bfed3993f"

# Cuando actives R2 en el dashboard, descomentá esto y las fotos nuevas van a R2:
# [[r2_buckets]]
# binding = "FOTOS"
# bucket_name = "flota-ml-fotos"

[vars]
CONTADOR_EMAIL = "santamariapablodaniel@gmail.com"
FROM_EMAIL = "santamariapablodaniel@gmail.com"
VAPID_PUBLIC_KEY = "BO5ffoUk2v9SANCQEHtJoApnWxSVk2ozvV-Cc_yG_ktp7bo339VqwL99kbgEYfWWzjFbYCZGsdqLIy9BnI8IUZY"

[observability]
enabled = true